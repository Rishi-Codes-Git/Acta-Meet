version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mom-postgres-acta
    restart: unless-stopped
    environment:
      POSTGRES_USER: mom_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mom_db
    ports:
      - "5432:5432"
    volumes:
      - mom_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mom_user -d mom_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mom_postgres_data:
